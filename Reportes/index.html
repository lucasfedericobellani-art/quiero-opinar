<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiero Opinar | Reportes</title>
    <meta name="description" content="Índice de reportes mensuales de Quiero Opinar.">
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <style>
      :root {
        color-scheme: dark;
        --bg: #050505;
        --text: #fff3e6;
        --muted: #b89a7d;
        --accent: #ff8a1f;
        --accent-hot: #ffb14a;
        --line: rgba(255, 138, 31, .24);
        --max: 980px;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          linear-gradient(180deg, rgba(5, 5, 5, .42), rgba(5, 5, 5, .9) 38rem, rgba(5, 5, 5, .96)),
          url("/Julio%202026/trama-quiero-opinar.png"),
          #050505;
        background-size: cover, min(1500px, 126vw) auto, auto;
        background-position: center top;
      }

      a { color: inherit; text-decoration: none; }

      .page {
        width: min(100% - 36px, var(--max));
        margin: 0 auto;
        padding: clamp(72px, 10vw, 132px) 0 80px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 64px;
        color: var(--accent-hot);
        font-size: .82rem;
        font-weight: 900;
        letter-spacing: .14em;
        text-transform: uppercase;
      }

      .brand img {
        width: 34px;
        height: 34px;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 30px;
        color: var(--accent);
        font-size: .78rem;
        font-weight: 900;
        letter-spacing: .16em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        content: "";
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 18px rgba(255, 138, 31, .8);
      }

      h1 {
        max-width: 760px;
        margin: 0;
        color: #fff6ea;
        font-size: clamp(3.5rem, 8vw, 6.4rem);
        line-height: .92;
        letter-spacing: 0;
      }

      h1 span {
        display: block;
        color: rgba(255, 243, 230, .42);
      }

      .intro {
        max-width: 620px;
        margin: 28px 0 56px;
        color: rgba(255, 230, 205, .76);
        font-size: clamp(1.05rem, 2vw, 1.28rem);
        line-height: 1.55;
      }

      .section-line {
        height: 1px;
        margin-bottom: 38px;
        background: linear-gradient(90deg, rgba(255, 138, 31, .34), transparent);
      }

      .group-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 20px;
      }

      h2 {
        margin: 0;
        color: #fff6ea;
        font-size: clamp(1.7rem, 3vw, 2.2rem);
        line-height: 1;
      }

      .count {
        color: rgba(255, 230, 205, .46);
        font-weight: 900;
      }

      .report-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .report-card {
        display: grid;
        grid-template-columns: 58px minmax(0, 1fr) auto;
        align-items: center;
        gap: 18px;
        min-height: 86px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(9, 9, 10, .78);
        box-shadow: 0 22px 70px rgba(0, 0, 0, .28);
        transition: transform .22s ease, border-color .22s ease, background .22s ease;
      }

      .report-card:hover {
        transform: translateY(-2px);
        border-color: rgba(255, 138, 31, .62);
        background: rgba(18, 13, 9, .9);
      }

      .report-mark {
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        border: 1px solid rgba(255, 138, 31, .3);
        border-radius: 8px;
        background: linear-gradient(145deg, rgba(255, 138, 31, .18), rgba(255, 255, 255, .02));
        color: var(--accent-hot);
        font-weight: 1000;
      }

      .report-title {
        display: block;
        color: #fff6ea;
        font-size: 1.08rem;
        font-weight: 900;
      }

      .report-meta {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-weight: 750;
      }

      .arrow {
        color: rgba(255, 230, 205, .46);
        font-size: 1.2rem;
      }

      .empty-card {
        opacity: .52;
        pointer-events: none;
      }

      .empty-card .report-mark {
        color: rgba(255, 230, 205, .46);
      }

      @media (max-width: 720px) {
        .page { padding-top: 48px; }
        .brand { margin-bottom: 46px; }
        .report-list { grid-template-columns: 1fr; }
        .group-head { display: block; }
        .count { display: block; margin-top: 8px; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <a class="brand" href="https://quieroopinar.com.ar">
        <img src="/logo.svg" alt="">
        <span>Quiero Opinar</span>
      </a>

      <p class="eyebrow">Reportes mensuales</p>

      <div class="section-line"></div>

      <section aria-labelledby="reportes-2026">
        <div class="group-head">
          <h2 id="reportes-2026">Reportes 2026</h2>
          <span class="count">1 publicado</span>
        </div>

        <div class="report-list">
          <a class="report-card" href="/Julio%202026">
            <span class="report-mark">J26</span>
            <span>
              <span class="report-title">Reporte julio 2026</span>
              <span class="report-meta">Comunidad, marketing e inversión</span>
            </span>
            <span class="arrow">→</span>
          </a>

          <article class="report-card empty-card">
            <span class="report-mark">A26</span>
            <span>
              <span class="report-title">Reporte agosto 2026</span>
              <span class="report-meta">Próximamente</span>
            </span>
            <span class="arrow">→</span>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
